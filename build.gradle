plugins {
    id 'java'
    id 'war'
    id 'org.gretty' version '4.0.0'
}

group = 'com.tharun.rest.add'
version = '1.0-SNAPSHOT'

description = 'SimpleAdService'

sourceCompatibility = '26'
targetCompatibility = '26'

repositories {
    mavenCentral()
}

ext {
    springVersion = '6.1.6'
    springBootVersion = '3.2.3'
    jacksonVersion = '2.17.0'
    junitVersion = '4.13.2'
    mockitoVersion = '5.11.0'
    slf4jVersion = '2.0.11'
    servletApiVersion = '4.0.1'
}

dependencies {
    // Spring Framework
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"

    // Jackson JSON
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // Servlet API
    compileOnly "javax.servlet:javax.servlet-api:${servletApiVersion}"

    // Logging
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.slf4j:slf4j-simple:${slf4jVersion}"

    // Testing Dependencies
    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "com.jayway.jsonpath:json-path:2.8.0"

    // Hamcrest for testing
    testImplementation "org.hamcrest:hamcrest:2.2"
}

tasks.named('test') {
    useJUnit()
}

war {
    archiveFileName = 'SimpleAdService.war'
}

// Gretty configuration for Jetty
gretty {
    servletContainer = 'jetty11'
    contextPath = '/SimpleAdService'
    port = 8080
}

// Java compiler options
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
    options.deprecation = true
    options.warnings = true
}

